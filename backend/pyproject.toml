[tool.black]
line-length = 88
target-version = ["py312"]
exclude = '''
/(
    migrations
)/
'''

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["config", "recipes"]